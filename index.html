<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/resources/logos/logo.png" />
    <link rel="stylesheet" href="/loading.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip2Guide</title>
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="app-loading-screen" role="status" aria-live="polite">
        <div class="app-loading-content">
          <img
            class="app-loading-logo"
            src="/resources/logos/logo_horizontal.png"
            alt="Trip2Guide"
          />
          <span class="app-loading-spinner" aria-hidden="true"></span>
          <p class="app-loading-text">We are preparing amazing routes just for you</p>
        </div>
      </div>
    </div>
    <div id="global-footer-mount"></div>
    <script>
      fetch('/footer.html')
        .then((response) => {
          if (!response.ok) {
            return '';
          }

          return response.text();
        })
        .then((html) => {
          const mount = document.getElementById('global-footer-mount');
          if (mount) {
            mount.innerHTML = html;
          }
        })
        .catch(() => {
          // Footer is optional. Keep app running if it fails to load.
        });
    </script>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
